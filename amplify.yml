# cshl on AWS Amplify Hosting: a static site behind the demo password.
#
# The functions under api/ run as the Lambda `cshl-api` behind CloudFront
# (ops/amplify/api-lambda.mjs); this file ships that Lambda together with the
# site, so the two never drift and nothing is compiled on a laptop. The API
# answers only a caller holding VITE_SITE_KEY, which exists only inside the
# password-protected bundle. Model calls run on Bedrock through the function's
# role; no key is stored.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --no-audit --no-fund
    build:
      commands:
        - npm run build
        - |
          npx esbuild ops/amplify/api-lambda.mjs --bundle --platform=node --format=esm \
            --target=node22 --main-fields=module,main --outfile=dist-lambda/index.mjs \
            --banner:js="import { createRequire as __cr } from 'node:module'; const require = __cr(import.meta.url);"
          (cd dist-lambda && zip -q ../function.zip index.mjs)
          aws lambda update-function-code --function-name cshl-api --zip-file fileb://function.zip --query LastModified --output text
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
